:root{
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,Menlo,monospace;
  --kj-bg:#dfe5ee;
  --kj-bg-img:none;
  --kj-text:#0f172a;--kj-muted:#52607a;
  --kj-border:rgba(15,23,42,.12);--kj-border-strong:rgba(15,23,42,.24);
  --kj-surface:rgba(15,23,42,.035);
  --kj-card:#ffffff;
  --kj-card-shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.08);
  --kj-field:#ffffff;--kj-nav:rgba(223,229,238,.86);--kj-sheet:#ffffff;--kj-tt:#ffffff;
  --kj-blue:#22d3ee;--kj-blue-ink:#04202a;--kj-blue-line:#0891b2;--kj-blue-soft:rgba(34,211,238,.14);
  --kj-red:#e11d48;--kj-red-line:#f43f5e;--kj-red-soft:rgba(251,113,133,.14);--kj-red-fill:#fb7185;--kj-red-ink:#2b060d;
  --kj-gold:#b45309;--kj-gold-line:#f59e0b;--kj-gold-soft:rgba(251,191,36,.16);
  --kj-violet:#7c3aed;--kj-violet-soft:rgba(124,58,237,.12);
  --kj-green:#047857;--kj-green-line:#059669;--kj-green-soft:rgba(16,185,129,.14);--kj-green-fill:#34d399;--kj-green-ink:#022c22;
  --kj-track:rgba(15,23,42,.10);--kj-focus:rgba(34,211,238,.35);--kj-scrim:rgba(15,23,42,.45);
  --c-weight:#65a30d;--c-fat:#ea580c;--c-waist:#0d9488;--c-steps:#0891b2;--c-workout:#e11d48;--c-kcal:#2563eb;--c-protein:#7c3aed;--c-carb:#d97706;--c-fatm:#db2777;--c-fiber:#059669;--c-cardio:#db2777;--c-volume:#991b1b;
}
[data-theme="dark"]{
  --kj-bg:#06080b;
  --kj-bg-img:none;
  --kj-text:#e6eaf0;--kj-muted:#9ba6b5;
  --kj-border:rgba(203,213,225,.14);--kj-border-strong:rgba(203,213,225,.28);
  --kj-surface:rgba(255,255,255,.04);
  --kj-card:#1b2029;
  --kj-card-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 6px 20px rgba(0,0,0,.6);
  --kj-field:rgba(0,0,0,.35);--kj-nav:rgba(6,8,11,.86);--kj-sheet:#20262f;--kj-tt:#151a21;
  --kj-blue-line:#22d3ee;--kj-blue-soft:rgba(34,211,238,.12);
  --kj-red:#fb7185;--kj-red-line:#fb7185;--kj-red-soft:rgba(251,113,133,.12);
  --kj-gold:#fbbf24;--kj-gold-line:#fbbf24;--kj-gold-soft:rgba(251,191,36,.10);
  --kj-violet:#a78bfa;--kj-violet-soft:rgba(167,139,250,.14);
  --kj-green:#6ee7b7;--kj-green-line:#34d399;--kj-green-soft:rgba(16,185,129,.16);
  --kj-track:rgba(203,213,225,.16);--kj-focus:rgba(34,211,238,.30);--kj-scrim:rgba(8,10,14,.66);
  --c-weight:#a3e635;--c-fat:#fb923c;--c-waist:#2dd4bf;--c-steps:#22d3ee;--c-workout:#fb7185;--c-kcal:#60a5fa;--c-protein:#a78bfa;--c-carb:#fbbf24;--c-fatm:#f472b6;--c-fiber:#34d399;--c-cardio:#f472b6;--c-volume:#dc2626;
}
[data-accent="orange"]{--kj-blue:#c2410c;--kj-blue-ink:#fff7ed;--kj-blue-line:#c2410c;--kj-blue-soft:rgba(234,88,12,.12);--kj-focus:rgba(234,88,12,.30)}
[data-theme="dark"][data-accent="orange"]{--kj-blue:#c2410c;--kj-blue-ink:#fff7ed;--kj-blue-line:#f97316;--kj-blue-soft:rgba(234,88,12,.16);--kj-focus:rgba(249,115,22,.32)}
[data-accent="pink"]{--kj-blue:#db2777;--kj-blue-ink:#ffffff;--kj-blue-line:#db2777;--kj-blue-soft:rgba(219,39,119,.12);--kj-focus:rgba(219,39,119,.30)}
[data-theme="dark"][data-accent="pink"]{--kj-blue:#db2777;--kj-blue-ink:#ffffff;--kj-blue-line:#f472b6;--kj-blue-soft:rgba(244,114,182,.16);--kj-focus:rgba(244,114,182,.32)}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}.sw-cyan{background:#22d3ee}.sw-orange{background:#c2410c}.sw-pink{background:#db2777}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--kj-bg);color-scheme:light}
[data-theme="dark"]{color-scheme:dark}
body{margin:0;color:var(--kj-text);font:15px/1.45 var(--ui);background:var(--kj-bg) var(--kj-bg-img) fixed no-repeat;min-height:100vh;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
::selection{background:var(--kj-focus)}
:focus-visible{outline:2px solid var(--kj-gold-line);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:-4px}
.ic.sm{width:16px;height:16px;vertical-align:-3px}
header{position:sticky;top:0;z-index:5;min-height:calc(56px + env(safe-area-inset-top));box-sizing:border-box;background:var(--kj-nav);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--kj-border);padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
main .rangebar{position:sticky;top:var(--hh,57px);z-index:4;display:flex;align-items:center;gap:10px;margin:0 -4px 10px;padding:8px 4px;background:color-mix(in srgb,var(--kj-bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
header h1{font:600 20px/1.2 var(--display);letter-spacing:0;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

 food and steps as 7-day, body fat as 21-day averages; workouts and volume as the previous 7 days’ count and total weight lifted. On days without data the line connects to the next value. This lets data in different units be compared on one chart; tap for the exact value. Use the buttons below to toggle series.","Étkezési energia (7 napos átlag)":"Food energy (7-day average)","Lépések (7 napos átlag)":"Steps (7-day average)","Edzések az előző 7 napban":"Workouts in the previous 7 days","Edzésvolumen az előző 7 napban":"Training volume in the previous 7 days","Összefüggések (":"Correlations (","nap)":"days)","Tényező":"Factor","Testsúly heti változása":"Weekly weight change","Testzsír 2 heti változása":"2-week body fat change","Ebben az időszakban a testsúly változásával leginkább a(z)":"In this period, weight change moved most closely with","mozgott együtt (r =":"(r =","– ha nőtt, a testsúly is inkább nőtt":"– when it rose, weight tended to rise too","– ha nőtt, a testsúly inkább csökkent":"– when it rose, weight tended to fall","Korrelációs együttható (r, −1…+1): az adott tényező szintje és az ugyanarra az időszakra eső súly-, illetve zsírváltozás együttmozgása. Pozitív: együtt nőnek; negatív: ellentétesen mozognak. Legalább 20 közös nap kell hozzá, és az együttmozgás nem bizonyít ok-okozatot – egy-egy rendhagyó hét (betegség, utazás) is erősen befolyásolhatja. A testzsír-mérés (főleg otthoni mérlegnél) zajos, ott a jelzés óvatosabban értelmezendő.":"Correlation coefficient (r, −1…+1): how the factor’s level moves together with the weight or fat change in the same period. Positive: they rise together; negative: they move in opposite directions. It needs at least 20 shared days, and correlation doesn’t prove causation – a single unusual week (illness, travel) can have a strong effect. Body fat measurements (especially on home scales) are noisy, so read that column with more caution.","A zsírtömeg többel csökkent, mint a testsúly – a zsírmentes tömeg (izom, víz) közb function T(v){if(LANG!=='en'||v==null)return v;v=String(v);if(!/[A-Za-zÀ-ž]/.test(v))return v;

function trSkip(el){for(let e=el;e&&e.nodeType===1;e=e.parentElement){const tg=e.tagName;if(tg==='SCRIPT'||tg==='STYLE'||tg==='TEXTAREA'||e.getAttribute('translate')==='no')return true}return false}

/* ===== Tárolás =====
   Fő tár: IndexedDB (a böngésző adatbázisa, nagyobb keret, aszinkron írás). A localStorage tükörként megmarad, amíg
   az adat elfér benne (kb. 5 MB) – így az indulás azonnali, és ha az IndexedDB nem érhető el, onnan tölt be.
   Mindkét helyen időbélyeg van; induláskor a frissebb nyer. */
const IDB={db:null,state:'pending',dirty:false};let mirrorFull=false,idbBusy=false,idbNext=null;
function idbOpen(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('nincs IndexedDB'));let r;try{r=indexedDB.open('olupan',1)}catch(e){return rej(e)}
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blokkolva'))})}
function idbReq(mode,fn){return new Promise((res,rej)=>{let v;try{const tx=IDB.db.transaction('kv',mode),rq=fn(tx.objectStore('kv'));rq.onsuccess=()=>{v=rq.result};tx.oncomplete=()=>res(v);tx.onerror=tx.onabort=()=>rej(tx.error||new Error('megszakítva'))}catch(e){rej(e)}})}
const idbGet=k=>idbReq('readonly',st=>st.get(k)),idbPut=(k,v)=>idbReq('readwrite',st=>st.put(v,k));
function idbSave(rec){idbNext=rec;if(idbBusy)return;idbBusy=true;
  (async()=>{while(idbNext){const r=idbNext;idbNext=null;
    try{await idbPut('state',r)}catch(e){console.warn('IndexedDB mentési hiba',e);IDB.state='off';
      try{localStorage.setItem(KEY,r.json);localStorage.setItem(KEY+'.ts',String(r.ts));mirrorFull=false}catch(e2){toast('Mentés sikertelen (tárhely?)')}}}
    idbBusy=false})()}
function save(){const json=JSON.stringify(S),ts=Date.now();
  try{localStorage.setItem('olupan.ui',JSON.stringify({theme:S.settings.theme||null,accent:S.settings.accent||'cyan'}))}catch(e){}
  let lsOk=false;if(!mirrorFull){try{localStorage.setItem(KEY,json);localStorage.setItem(KEY+'.ts',String(ts));lsOk=true}catch(e){mirrorFull=true}}
  if(IDB.state==='ok')idbSave({json,ts});else if(IDB.state==='pending')IDB.dirty=true;else if(!lsOk)toast('Mentés sikertelen (tárhely?)')}
async function bootStore(){
  try{IDB.db=await idbOpen()}catch(e){console.warn('IndexedDB nem érhető el – marad a helyi tárhely',e);IDB.state='off';return}
  try{
    const rec=await idbGet('state'),lsTs=+(localStorage.getItem(KEY+'.ts')||0);
    if(rec&&rec.json&&(rec.ts||0)>lsTs){ // az IndexedDB frissebb (pl. a tükör betelt vagy törlődött) → onnan töltünk
      const s=sanitizeState(JSON.parse(rec.json));if(s.v<DATA_V){addDefaults(s);s.v=DATA_V}S=s;
      tab=S.active?'workout':'home';applyTheme();applyLang();render();
    }else{ // első indulás az új tárral (átemelés) vagy a tükör a frissebb: az IndexedDB-be írjuk, és visszaolvasva ellenőrizzük
      const json=JSON.stringify(S),ts=lsTs||Date.now();await idbPut('state',{json,ts});
      const back=await idbGet('state');if(!back||back.json!==json)throw new Error('ellenőrzés sikertelen');
    }
    IDB.state='ok';
    if(IDB.dirty){IDB.dirty=false;save()}
    try{if(navigator.storage&&navigator.storage.persist&&!localStorage.getItem('olupan.persist'))navigator.storage.persist().then(p=>{try{localStorage.setItem('olupan.persist',p?'1':'0')}catch(e){}})}catch(e){}
  }catch(e){console.warn('IndexedDB nem használható – marad a helyi tárhely',e);IDB.state='off'}
}

  setTimeout(()=>{try{navigator.storage&&navigator.storage.persisted&&navigator.storage.persisted().then(p=>{const el=$('#persist');if(el)el.textContent=p?L('engedélyezve','granted'):L('a böngésző dönt róla','up to the browser')})}catch(e){}},0);
  return `<div class="card"><h2>Tárolás</h2><div class="exl"><span>Adatok mérete</span><span>${size}</span></div><div class="exl"><span>Hely</span><span>${where}</span></div><div class="exl"><span>Tartós tárolás</span><span id="persist">–</span></div>

function bests(sets,cardio,kind){const b={w:0,e:0,r:0,v:0};for(const s of sets){if(s.wu)continue;if(s.w>b.w)b.w=s.w;if(cardio||kind==='time'||kind==='reps'){if(s.r>b.r)b.r=s.r;continue}const e=e1rm(s.w,s.r);if(e>b.e)b.e=e;if(s.r>b.r)b.r=s.r;if(s.w*s.r>b.v)b.v=s.w*s.r}return b}
function bestsBefore(exId,ts,skipId){const all=[];for(const w of S.workouts){if(w.id===skipId||w.start>=ts)continue;for(const e of w.exercises)if(e.exId===exId)all.push(...e.sets)}return all.length?bests(all,isCardio(exId),exKind(exId)):null}
function detectPRs(w){const out=[];for(const e of w.exercises){const prev=bestsBefore(e.exId,w.start,w.id);if(!prev)continue;const cur=bests(e.sets,isCardio(e.exId),exKind(e.exId));for(const t of['w','e','r','v'])if(cur[t]>prev[t]+1e-9&&cur[t]>0)out.push({exId:e.exId,type:t,val:Math.round(cur[t]*10)/10})}return out}

function tpSet(k,v){const p=tpPrefs(),tog=(arr,x)=>{const a=new Set(arr);a.has(x)?a.delete(x):a.add(x);return[...a]};

  S.settings.tp=p;save();if(['goal','eq','mode','focus','other','dbType'].includes(k)){const y=$('#sheet')?.scrollTop||0;openPlanReq();const sh=$('#sheet');if(sh)sh.scrollTop=y}}
/* Az elmúlt 4 hét gyakorlatai a Claude-nak: gyakorlatonként edzésszám, munkasorozat, legutóbbi legjobb sorozat */
function planHistLines(L2){const now=Date.now(),agg={};
  for(const w of S.workouts){if(w.start<now-28*DAY)continue;for(const e of w.exercises){const ex=exById(e.exId);if(!ex)continue;const ws=e.sets.filter(s=>!s.wu&&(s.done!==false));if(!ws.length)continue;
    const a=agg[ex.id]||(agg[ex.id]={n:0,sets:0,last:0,best:null,name:T(ex.name),cardio:ex.kind==='cardio'});a.n++;a.sets+=ws.length;if(w.start>=a.last){a.last=w.start;const b=ws.reduce((m,s)=>(+s.w||0)>(+m.w||0)?s:m,ws[0]);a.best=b}}}
  const l=Object.values(agg).sort((a,b)=>b.sets-a.sets);if(!l.length)return[];
  return[L2('Az elmúlt 4 hét gyakorlatai (edzések száma, munkasorozatok, a legutóbbi edzés legnehezebb sorozata):','My exercises in the last 4 weeks (sessions, working sets, heaviest set in the latest session):'),
    ...l.slice(0,40).map(a=>`- ${a.name}: ${a.n}× · ${a.sets} ${L2('sorozat','sets')}${a.cardio?'':a.best&&(a.best.w||a.best.r)?` · ${L2('legutóbb','latest')} ${a.best.w?hu(+a.best.w,1)+' kg × ':''}${a.best.r||'?'}`:''}`),
    L2('Ezekre építs: ahol működik, tartsd meg a gyakorlatot, és a súlyokat ehhez igazítsd.','Build on these: keep exercises that work and set the loads accordingly.')]}

  if(p.eq.includes('bar'))out.push(L2('Rúd otthon: ','Barbell at home: ')+(p.barKg||L2('súly nincs megadva','load not given'))+(p.rack?L2(', guggolóállvánnyal',', with squat rack'):L2(', állvány nélkül',', no rack')));

  return out}

function parsePlan(text){const m=text.match(/```[a-z]*\n?([\s\S]*?)```/i);if(m)text=m[1];
  let plan='',cur=null;const tpls=[];
  for(let line of text.split(/\r?\n/)){line=line.trim();if(!line)continue;const parts=line.split(/\s*;\s*/),k=parts[0].toUpperCase();
    if(k==='TERV'||k==='PLAN'){plan=(parts[1]||'').slice(0,60);continue}
    if(k==='SABLON'||k==='TEMPLATE'){cur={name:(parts.slice(1).join(' ')||'Edzés').slice(0,100),items:[]};tpls.push(cur);continue}
    if(!cur||parts.length<2)continue;
    const sets=Math.max(1,Math.min(30,parseInt(parts[1])||3)),reps=(parts[2]||'').replace(/[^\d\-–]/g,'').slice(0,9),ss=parts.slice(2).some(x=>/^ss$/i.test(x));
    cur.items.push({name:parts[0].slice(0,100),sets,reps,ss})}
  return{plan,tpls:tpls.filter(t=>t.items.length)}}
function findEx(name){const n=name.toLowerCase(),rev=revEN();const hu=rev[name]||name;return S.exercises.find(e=>e.name.toLowerCase()===n||e.name.toLowerCase()===hu.toLowerCase()||T(e.name).toLowerCase()===n)}
/* Edzésterv ellenőrzése beolvasáskor: napok száma, ismétlés, eszköz, heti sorozat izomcsoportonként, becsült időtartam, kerülendő gyakorlatok */

function planCheck(P){const p=tpPrefs(),en=LANG==='en',o=[],mu=k=>{const m=MUSCLES.find(x=>x[0]===k);return m?(en?m[2]:m[1]):k};
  if(P.tpls.length!==p.days)o.push(L(`${P.tpls.length} edzésnap a kért heti ${p.days} helyett`,`${P.tpls.length} training days instead of the ${p.days} a week you asked for`));
  const noRep=[...new Set(P.tpls.flatMap(t=>t.items.filter(i=>!i.reps).map(i=>i.name)))];if(noRep.length)o.push(L('Nincs megadva ismétlésszám: ','No reps given: ')+noRep.join(', '));
  const meta=n=>findEx(n)||fillMeta({name:n,cat:'Egyéb'});
  if(!p.eq.includes('gym')){const ok=new Set(['bw','other',...p.eq.filter(x=>['db','kb','bar'].includes(x))]);
    const bad=[...new Set(P.tpls.flatMap(t=>t.items.filter(i=>{const e=meta(i.name),q=e.eq||exEquip(e.id);return['bar','mach','db','kb'].includes(q)&&!ok.has(q)}).map(i=>i.name)))];
    if(bad.length)o.push(L('Olyan eszköz kell hozzá, amit nem adtál meg: ','Needs equipment you didn’t list: ')+bad.join(', '))}
  const sets={};for(const t of P.tpls)for(const i of t.items){const e=meta(i.name);if(!e.mu||e.kind==='cardio')continue;sets[e.mu]=(sets[e.mu]||0)+i.sets;for(const k of e.mu2||[])sets[k]=(sets[k]||0)+i.sets/2}
  const ax=MUSCLES.filter(m=>m[0]!=='full').map(m=>m[0]);
  if(p.mode==='spec'){const low=p.focus.filter(k=>(sets[k]||0)<10);if(low.length)o.push(L('Kiemelt izomcsoport heti 10 sorozat alatt: ','Focus muscle group under 10 sets a week: ')+low.map(k=>`${mu(k)} ${fmt(sets[k]||0,1)}`).join(', '))}
  else{const low=ax.filter(k=>(sets[k]||0)<10),hi=ax.filter(k=>(sets[k]||0)>20);
    if(low.length)o.push(L('Heti 10 sorozat alatt: ','Under 10 sets a week: ')+low.map(k=>`${mu(k)} ${fmt(sets[k]||0,1)}`).join(', '));
    if(hi.length)o.push(L('Heti 20 sorozat felett: ','Over 20 sets a week: ')+hi.map(k=>`${mu(k)} ${fmt(sets[k],1)}`).join(', '))}
  const long=P.tpls.filter(t=>t.items.reduce((a,i)=>a+i.sets,0)*2.5+5>p.mins*1.25);
  if(long.length)o.push(L(`Valószínűleg hosszabb ${p.mins} percnél (sorozatonként kb. 2,5 perccel számolva): `,`Probably longer than ${p.mins} minutes (about 2.5 min per set): `)+long.map(t=>t.name).join(', '));
  if(p.avoid){const av=p.avoid.split(/[,;\n]/).map(x=>deacc(x.trim())).filter(x=>x.length>=4),hit=[...new Set(P.tpls.flatMap(t=>t.items.filter(i=>av.some(a=>deacc(i.name).includes(a))).map(i=>i.name)))];if(hit.length)o.push(L('Kerülendőnek jelölt gyakorlat: ','Exercise you asked to avoid: ')+hit.join(', '))}
  return o}

const DBF=FOODDB.map(r=>({id:'d'+r[0],hu:r[2],en:r[3],kcal:r[4],p:r[5],c:r[6],f:r[7],fib:r[8],alc:r[9]||0,unit:r[10]?'ml':'g',usda:r[11]>0?r[11]:0,chain:r[11]===-1,brand:r[11]===-2,portions:r[12]||[]}));
const DB_BY=new Map(DBF.map(x=>[x.id,x]));
const NUT=['kcal','p','c','f','fib','alc'];
const foodName=x=>x.own||x.off||x.blank?x.name:(LANG==='en'?x.en:x.hu);
const foodById=id=>id?(DB_BY.get(id)||(S.foods||[]).find(x=>x.id===id)||(String(id).startsWith('rc')?recFoods().find(x=>x.id===id):null)||null):null;
const ownFoods=()=>(S.foods||[]).map(x=>Object.assign({own:true},x));
/* Saját receptek a keresőben: adagra és grammra is. Ha a receptben nincs adagtömeg, a nyers g/ml hozzávalókból becsüljük; ha az sem megy, csak adagra vihető fel */
function recGrams(r){if(r.g)return[r.g,false];let t=0;for(const i of r.ing||[]){const u=deacc(i.u||'').trim();if(i.q==null)continue;if(u==='g'||u==='ml')t+=i.q;else if(u==='kg'||u==='l')t+=i.q*1000;else if(u==='dl')t+=i.q*100}
  const g=Math.round(t/(r.serv||1)/10)*10;return g>=80?[g,true]:[null,false]}
function recFoods(){return(S.recipes||[]).filter(r=>r.kcal!=null).map(r=>{const[g,est]=recGrams(r),G=g||100,k=v=>v==null?0:Math.round(v*100/G*10)/10;
  return{id:'rc'+r.id,own:true,rec:true,noGram:!g,name:r.name,unit:'g',kcal:Math.round(r.kcal*100/G*10)/10,p:k(r.p),c:k(r.c),f:k(r.f),fib:k(r.fib),alc:0,
    portions:[g?[`1 adag (${est?'kb. ':''}${g} g)`,`1 serving (${est?'approx. ':''}${g} g)`,g]:['1 adag','1 serving',100]]}})}
const euKcal=v=>Math.round(4*(v.p||0)+4*(v.c||0)+9*(v.f||0)+2*(v.fib||0)+7*(v.alc||0));
function foodSrc(x){if(!x)return'';if(x.rec)return L('saját recept (a recept adagonkénti értékei alapján)','own recipe (from the recipe’s per-serving values)');if(x.off)return L('Open Food Facts (ODbL), közösségi adat – ellenőrizd a címkével','Open Food Facts (ODbL), community data – check against the label');if(x.blank)return L('saját rögzítés a címke alapján','own entry from the label');if(x.own)return x.src==='off'?L('vonalkóddal mentve az Open Food Facts (ODbL) közösségi adataiból – ellenőrizd a címkével','saved by barcode from Open Food Facts (ODbL) community data – check against the label'):L('saját rögzítés','own entry');if(x.chain){const n=x.hu||'',w=/\(Burger King\)$/.test(n)?L('Burger King, 2026. július','Burger King, July 2026'):/\(Subway\)$/.test(n)?L('Subway, 2025. március','Subway, March 2025'):/\(KFC\)$/.test(n)?'KFC':'';return L(`a lánc hivatalos magyarországi tápértéktáblázata${w?` (${w})`:''} – az étteremben kis eltérés lehet`,`the chain’s official Hungarian nutrition table${w?` (${w})`:''} – small differences in the restaurant are possible`)}return x.usda?L('USDA (európai kalóriaszámítási módszerrel)','USDA (European calorie calculation method)'):L('becslés (magyar termékátlag)','estimate (Hungarian product average)')}
// az aposztróf és a kötőjel nem számít: „mcdonalds” = „McDonald's”
const sNorm=t=>deacc(t).replace(/['’`]/g,'').replace(/-/g,' ');
function foodSearch(q,n=20){const toks=sNorm(q).split(/[\s,]+/).filter(Boolean);if(!toks.length)return[];
  const res=[];for(const x of[...ownFoods(),...recFoods(),...DBF]){const nm=sNorm(foodName(x)),hay=x.own?nm+(x.ean?' '+x.ean:''):sNorm(x.hu+' '+x.en);
    if(!toks.every(t=>hay.includes(t)))continue;const words=nm.split(/[\s,()/]+/);
    const sc=(x.own?0:10)+(nm.startsWith(toks[0])?0:words.some(w=>w.startsWith(toks[0]))?2:5)+toks.filter(t=>!nm.includes(t)).length*3+nm.length/100;res.push([sc,x])}
  /* a sima ételek (adattár és saját tételek) elöl, a receptekből származók a lista végén */
  res.sort((a,b)=>a[0]-b[0]);const R=res.filter(r=>r[1].rec),F=res.filter(r=>!r[1].rec);
  return[...F.slice(0,n),...R.slice(0,Math.max(5,n-F.length))].map(r=>r[1])}

function mfNew(m){const x={id:m?.id||null,meal:m?.meal||(foodDate===today()?guessMeal():'ebed'),tab:'search',q:'',food:null,mult:'1',name:m?.name||'',qty:'',u:'g',per:null,base:null,msg:'',added:[],
    tot:{kcal:m?.kcal??'',p:m?.p??'',c:m?.c??'',f:m?.f??'',fib:m?.fib??'',alc:m?.alc??0},date:m?.date||foodDate};
  const fd=m&&foodById(m.fid);if(fd&&m.qty){mfPick(x,fd);x.u=m.u||x.u;x.qty=String(m.qty);x.name=m.fname||x.name}else if(m)x.tab='new';return x}
function mfPick(x,fd){x.tab='search';x.food=fd;x.name=foodName(fd);x.u=fd.unit;x.qty=x.qty||(fd.portions?.length?'':'100');if(fd.portions?.length&&!x.qty){x.u='p0';x.qty='1'}
  x.per={};for(const k of NUT)x.per[k]=fd[k]??0;x.base=Object.assign({},x.per)}

  if(x.u==='g'||x.u==='ml')return q;const p=x.food.portions?.[+x.u.slice(1)];return p?q*p[2]:null}
function mfTotals(){if(!mf.food||mf.tab==='new'){const m=parseMacro(mf.mult)??1,t={};for(const k of NUT){const v=parseMacro(mf.tot[k]);t[k]=v==null?0:(k==='kcal'?Math.round(v*m):Math.round(v*m*10)/10)}return t}
  const g=mfGrams(),t={};for(const k of NUT){const v=parseMacro(mf.per[k]);t[k]=g==null||v==null?0:v*g/100}t.kcal=Math.round(t.kcal);for(const k of['p','c','f','fib','alc'])t[k]=Math.round(t[k]*10)/10;return t}

function mfSave(){const x=mf,isF=x.food&&x.tab==='search',t=mfTotals();if(!x.name.trim()){toast(L('Adj meg megnevezést','Enter a name'));return}

      const o=Object.assign({id:'f'+uid(),name:fname.slice(0,80),unit:fd.unit},fd.rec?{}:{base:fd.id},per);if(fd.portions?.length)o.portions=fd.portions.map(p=>[p[0],p[1],p[2]]);

/* ===== Vonalkód: beolvasás külön oldalon (scanner.html, saját CSP), lekérés az Open Food Facts adatbázisából =====

const canScan=()=>location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
let scanReady=false,scanWD=0;
function openScanner(){if(!canScan()){toast(L('A vonalkód-olvasó csak az olupan.com-on érhető el','The barcode reader is only available on olupan.com'));return}
  closeScanner();scanReady=false;const ov=document.createElement('div');ov.id='scanov';ov.className='scanov';
  const f=document.createElement('iframe');f.src='/scanner.html'+(LANG==='en'?'?lang=en':'');f.setAttribute('allow','camera');f.title=L('Vonalkód-olvasó','Barcode reader');
  const x=document.createElement('button');x.className='scanx';x.type='button';x.textContent='✕ '+L('Bezárás','Close');x.addEventListener('click',closeScanner);
  ov.append(f,x);document.body.appendChild(ov);
  /* ha a beolvasó oldal 6 mp alatt nem jelentkezik (blokkolt keret, hálózati hiba), kézi beírás a főappban */
  scanWD=setTimeout(()=>{if(!scanReady&&$('#scanov'))scanFallback()},6000)}
function scanFallback(){const ov=$('#scanov');if(!ov)return;const fr=ov.querySelector('iframe');if(fr)fr.remove();
  const d=document.createElement('div');d.className='scanfb';
  d.innerHTML=`<b>${L('A kamerás beolvasó nem indult el.','The camera reader didn’t start.')}</b><div class="hint">${L('Írd be a vonalkód alatti számot:','Type the number under the barcode:')}</div><div class="row" style="flex-wrap:nowrap;gap:8px;margin-top:8px"><input id="scanman" inputmode="numeric" maxlength="14" class="mono" style="flex:1;min-width:0" autocomplete="off"><button class="btn p" id="scanmanok" type="button">${L('Keresés','Search')}</button></div>`;
  ov.appendChild(d);const go=()=>{const c=$('#scanman').value.replace(/\D/g,'');if(!/^(\d{8}|\d{12,14})$/.test(c)){toast(L('Ez nem érvényes vonalkód','That isn’t a valid barcode'));return}closeScanner();barcodeFound(c)};
  $('#scanmanok').addEventListener('click',go);$('#scanman').addEventListener('keydown',e=>{if(e.key==='Enter')go()});setTimeout(()=>$('#scanman')?.focus(),50)}
/* ha az app háttérbe kerül, a beolvasót teljesen bezárjuk: a kamera nem maradhat nyitva, és visszatéréskor sem indulhat el */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')closeScanner()});
function closeScanner(){clearTimeout(scanWD);const o=$('#scanov');if(!o)return;const f=o.querySelector('iframe');if(f){try{f.contentWindow&&f.contentWindow.olupanStop&&f.contentWindow.olupanStop()}catch(e){}try{f.src='about:blank'}catch(e){}}o.remove()}
addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.src!=='olupan-scan')return;if(e.data.type==='ready'){scanReady=true;return}closeScanner();if(e.data.type==='qr'&&typeof e.data.text==='string'){if(e.data.text.includes('#i=1.'))shareImportText(e.data.text.slice(0,300000));else toast(L('Ez a QR-kód nem Olupan-megosztás','This QR code isn’t an Olupan share'));return}if(e.data.type==='code'&&/^\d{8,14}$/.test(e.data.code))barcodeFound(e.data.code)});
const offN=v=>{v=+v;return isFinite(v)&&v>=0?Math.round(v*10)/10:null};
async function barcodeFound(code){if(!mf)openFoodEntry();
  const alt=code.length===12?'0'+code:code.length===13&&code[0]==='0'?code.slice(1):null;
  const own=ownFoods().find(x=>x.ean===code||(alt&&x.ean===alt));
  if(own){mf.qty='';mfPick(mf,own);renderMF();toast(L('Megvan a saját tételeid között','Found in your own items'));return}
  if(!navigator.onLine){mfBlank(code,L('Nincs internetkapcsolat, így nem tudtam lekérdezni. Add meg a címkéről a 100 g-ra vagy 100 ml-re vonatkozó értékeket: a terméket a vonalkóddal együtt mentem.','You’re offline, so I couldn’t look it up. Enter the per-100 g or per-100 ml values from the label: I’ll save the product with its barcode.'));return}
  if(!await offConsent())return;
  toast(L('Keresés az Open Food Facts adatbázisában…','Searching Open Food Facts…'));
  let p=null;
  for(const c of[code,alt].filter(Boolean)){try{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000);
      const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${c}.json?fields=product_name,product_name_hu,product_name_en,generic_name,generic_name_hu,abbreviated_product_name,brands,quantity,product_quantity,product_quantity_unit,serving_size,serving_quantity,nutriments&app_name=Olupan`,{signal:ctl.signal,credentials:'omit',referrerPolicy:'no-referrer'});clearTimeout(t);
      if(r.ok){const j=await r.json();if(j&&j.status===1&&j.product){p=j.product;break}}}catch(e){}}
  const fd0=p&&offToFood(p,code);
  if(!fd0&&p){const nm=offName(p);mfBlank(code,L('Ez a termék szerepel az Open Food Facts adatbázisában, de nincs megadva a tápértéke. Fotózd le a tápértéktáblát, vagy add meg a 100 g-ra / 100 ml-re vonatkozó értékeket: a terméket a vonalkóddal együtt mentem.','This product is in Open Food Facts, but without nutrition data. Take a photo of the nutrition label, or enter the per-100 g / 100 ml values: I’ll save the product with its barcode.'),nm,offMl(p)?'ml':'g');return}
  if(!fd0){mfBlank(code,L('Ez a termék nincs benne az Open Food Facts adatbázisában (vagy nincs megadva a tápértéke). Add meg a címkéről a 100 g-ra vagy 100 ml-re vonatkozó értékeket: a terméket a vonalkóddal együtt mentem, és legközelebb internet nélkül is megtalálom.','This product isn’t in Open Food Facts (or has no nutrition data). Enter the per-100 g or per-100 ml values from the label: I’ll save the product with its barcode and find it next time, even offline.'),p&&(p.product_name_hu||p.product_name||'')||'');return}
  /* a lekérdezett terméket rögtön elmentjük a saját tételek közé: akkor is kereshető lesz, ha most nem rögzíted, és legközelebb internet nélkül is megvan */
  const o={id:'f'+uid(),name:fd0.name.slice(0,80),unit:fd0.unit,ean:fd0.ean,src:'off'};for(const k of NUT)o[k]=Math.max(0,Math.min(k==='kcal'?1000:100,+fd0[k]||0));if(fd0.portions.length)o.portions=fd0.portions.map(p=>[p[0],p[1],p[2]]);
  S.foods=(S.foods||[]).filter(y=>y.ean!==o.ean);S.foods.push(o);save();
  const fd=Object.assign({own:true},o);mf.qty='';mfPick(mf,fd);mf.name=fd.name;renderMF();toast(L('Megvan – elmentve a saját tételeid közé, a keresőben is megtalálod','Found – saved to your own items, you’ll also find it in search'))}
/* Open Food Facts termék → élelmiszer (100 g / 100 ml); null, ha nincs használható tápérték */
/* név: termék neve, ha nincs, az általános vagy rövidített név; a márka zárójelben, ha a névben nem szerepel */
function offName(p){const nm=String((LANG==='en'?p.product_name_en||p.product_name:p.product_name_hu||p.product_name)||p.product_name_en||p.product_name_hu||(LANG==='en'?'':p.generic_name_hu)||p.generic_name||p.abbreviated_product_name||'').trim(),br=String(p.brands||'').split(',')[0].trim();
  return(nm?nm+(br&&!deacc(nm).includes(deacc(br))?` (${br})`:''):br).slice(0,80)}
const offMl=p=>/\b(ml|cl|dl|l)\b/i.test(String(p.product_quantity_unit||p.quantity||''));
function offToFood(p,code){if(!p)return null;const n=p.nutriments||{},sq0=offN(p.serving_quantity);
  /* 100 g-os érték; ha csak adagra van megadva, átszámolva */
  const g=k=>offN(n[k+'_100g'])??(sq0>0&&offN(n[k+'_serving'])!=null?Math.round(n[k+'_serving']*1000/sq0)/10:null);
  const kj=g('energy-kj')??g('energy');
  const kcal=g('energy-kcal')??(kj!=null?Math.round(kj/4.184):null);
  if(kcal==null&&g('proteins')==null)return null;
  const ml=offMl(p),alc=g('alcohol');
  const fd={off:true,ean:String(code||p.code||'').replace(/\D/g,'').slice(0,14),unit:ml?'ml':'g',name:offName(p)||L('Termék','Product'),
    p:g('proteins')??0,c:g('carbohydrates')??0,f:g('fat')??0,fib:g('fiber')??0,alc:alc!=null?Math.round(alc*0.789*10)/10:0,portions:[]};
  fd.kcal=kcal??euKcal(fd);
  const sq=sq0;if(sq&&sq>0&&sq<5000){const ss=String(p.serving_size||'').slice(0,40)||`${sq} ${fd.unit}`;const own=/[a-zá-ű]/i.test(ss.replace(/\b(g|ml|gr|gramm)\b/gi,''));fd.portions.push(own?[ss,ss,sq]:[`1 adag (${ss})`,`1 serving (${ss})`,sq])}

/* tápértéktábla szövege → 100 g-os értékek. OCR-hibák: a „g” gyakran 9-nek olvasódik, a tizedesvessző elveszhet; a jelöltek közül az a kombináció nyer,
   amely a legjobban kiadja a címkén szereplő energiát (4·fehérje + 4·szénhidrát + 9·zsír + 2·rost), és teljesíti a korlátokat */
function labelParse(txt){
  const T=String(txt||'').replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
  const nrm=deacc;
  const FIELDS=[['sat',/telitett|saturat/],['sug',/cukor|cukrok|sugar/],['fib',/rost|fib(re|er)/],['p',/feherje|protein/],['salt',/(^|\W)so(\W|$)|salt|natrium/],['c',/szenhidrat|carbohydrate/],['f',/zsir|(^|\W)fat(\W|$)/]];
  const out={},raw={};
  const lines=T.map(l=>({l,n:nrm(l)}));
  /* energia: kcal-t keresünk az egész szövegben (két oszlopnál az első a 100 g-os), ha nincs, kJ-ból */
  const num=x=>parseFloat(x.replace(/\s/g,'').replace(',','.'));
  for(const {n} of lines){const k=n.match(/(\d[\d.,]*)\s*k\s*c\s*a\s*l/);if(k&&num(k[1])<=1000){out.kcal=num(k[1]);break}}
  if(out.kcal==null)for(const {n} of lines){const j=n.match(/(\d[\d\s.,]*?)\s*k\s*j/);if(j&&num(j[1])<=4200){out.kcal=Math.round(num(j[1])/4.184);break}}
  /* a többi sor: a mező neve UTÁNI első szám (két oszlopnál ez a 100 g-os) */
  for(const {n} of lines){for(const [k,re] of FIELDS){if(raw[k]!=null)continue;const mm=re.exec(n);if(!mm)continue;
      if(k==='f'&&/telitett|saturat/.test(n))continue;if(k==='c'&&/cukor|sugar/.test(n))continue;
      const rest=n.slice(mm.index+mm[0].length).replace(/o(?=\d)/g,'0').replace(/(\d[.,]?)o/g,(_,d)=>d+'0'),m=rest.match(/(\d+(?:[.,]\d+)?)(\s*[gq](?![a-z]))?/);
      if(m){raw[k]=m[1];raw[k+'_g']=!!m[2]}break}}
  /* jelölt + költség: ahogy olvasható 0; a végén álló 9 levágva (g volt) 0,002; elveszett tizedesvessző egy tizedesre 0,003, máshová 0,006;
     1 feletti, két tizedesjegyű érték ritka a címkén: +0,005 */
  const cands=k=>{const r=raw[k];if(r==null)return[{v:null,c:0}];const s=r.replace(',','.'),M=new Map();
    const add=(v,c)=>{if(!isFinite(v)||v<0||v>100)return;v=Math.round(v*100)/100;if(v>=1&&Math.round(v*10)!==v*10)c+=0.005;if(!M.has(v)||M.get(v)>c)M.set(v,c)};
    const strip9=/9$/.test(s)&&s.length>1?s.slice(0,-1).replace(/\.$/,''):null;
    for(const [base,c0] of [[s,0],[strip9,0.002]]){if(!base)continue;add(parseFloat(base),c0+((base.split('.')[1]||'').length>2?0.004:0));
      if(!base.includes('.')&&base.length>=2)for(let i=1;i<base.length;i++)add(parseFloat(base.slice(0,i)+'.'+base.slice(i)),c0+(i===base.length-1?0.003:0.006))}
    return M.size?[...M].map(([v,c])=>({v,c})):[{v:null,c:0}]};
  const keys=['f','sat','c','sug','fib','p','salt'],C=Object.fromEntries(keys.map(k=>[k,cands(k)]));
  /* a kombináció, amely a legjobban kiadja az energiát, és teljesíti a korlátokat (telített ≤ zsír, cukor ≤ szénhidrát, összeg ≤ 100) */
  let best=null;const E=out.kcal;
  const pick=(i,cur)=>{if(i===keys.length){const v=cur;const g=x=>x??0;
      if(v.sat!=null&&v.f!=null&&v.sat>v.f+0.05)return;if(v.sug!=null&&v.c!=null&&v.sug>v.c+0.05)return;if(g(v.f)+g(v.c)+g(v.p)+g(v.fib)+g(v.salt)>101)return;
      const est=4*g(v.p)+4*g(v.c)+9*g(v.f)+2*g(v.fib),err=E?Math.abs(est-E)/E:0;
      /* kisebb eltérés jobb; azonos eltérésnél az OCR-szöveghez közelebbi (kevesebb javítás) */
      const sc=err+cost;if(!best||sc<best.sc)best={sc,v:{...v},err};return}
    for(const x of C[keys[i]]){cur[keys[i]]=x.v;cost+=x.c;pick(i+1,cur);cost-=x.c}};
  let cost=0;pick(0,{});
  if(best)Object.assign(out,best.v,{err:best.err});
  return out}

/* ===== Tápértéktábla felismerése fotóról: tesseract.js, teljesen a készüléken fut (a kép nem megy el sehova). Első használatkor ~4 MB letöltés. ===== */
let ocrW=null;
async function ocrWorker(){if(ocrW)return ocrW;const T=await loadJs('/assets/ocr/tesseract.min.js','@@SRI_OCR@@','Tesseract');
  ocrW=await T.createWorker('hun',1,{workerPath:'/assets/ocr/worker.min.js',corePath:'/assets/ocr/',langPath:'/assets/ocr',gzip:true,workerBlobURL:false,
    logger:m=>{const e=$('#mfocrst');if(!e)return;const pc=Math.round((m.progress||0)*100);e.textContent=/recogniz/.test(m.status)?L(`Felismerés… ${pc}%`,`Reading… ${pc}%`):L('Felismerő betöltése… (első alkalommal pár MB)','Loading the reader… (a few MB the first time)')}});
  return ocrW}
function mfOcrPick(){const i=$('#mfocrin');i&&i.click()}
/* a kép előkészítése: max. 2000 px, szürkeárnyalat, nyújtott kontraszt */
async function ocrPrep(file){const bm=await createImageBitmap(file),k=Math.min(1,2000/Math.max(bm.width,bm.height)),w=Math.round(bm.width*k),h=Math.round(bm.height*k);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.drawImage(bm,0,0,w,h);bm.close&&bm.close();
  const d=cx.getImageData(0,0,w,h),a=d.data;let lo=255,hi=0;for(let i=0;i<a.length;i+=4){const y=(a[i]*299+a[i+1]*587+a[i+2]*114)/1000;a[i]=y;if(y<lo)lo=y;if(y>hi)hi=y}
  const r=hi-lo>20?255/(hi-lo):1;for(let i=0;i<a.length;i+=4){const y=Math.max(0,Math.min(255,(a[i]-lo)*r));a[i]=a[i+1]=a[i+2]=y}cx.putImageData(d,0,0);return cv}
async function mfOcrFile(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f||!mf.food)return;
  if(typeof createImageBitmap!=='function'||typeof Worker!=='function'||typeof WebAssembly!=='object'){toast(L('Ez a böngésző nem tudja felismerni a képet. Használd a Szöveg beillesztése gombot.','This browser can’t read the image. Use Paste text instead.'));return}
  mf.ocr={busy:true};renderMF();
  try{const cv=await ocrPrep(f),w=await ocrWorker(),r=await w.recognize(cv);mfOcrApply(r.data.text||'',L('A fotóról','From the photo'))}
  catch(e){console.warn(e);mf.ocr={msg:L('Nem sikerült a felismerés (lehet, hogy most nincs internet, és a felismerő még nincs letöltve). Add meg kézzel az értékeket.','Recognition failed (you may be offline and the reader isn’t downloaded yet). Enter the values by hand.'),bad:true};renderMF()}}
async function mfOcrPaste(){if(!mf.food)return;
  const r=await form(L('Tápértéktábla szövege','Nutrition label text'),[{id:'t',label:L('Beillesztett szöveg','Pasted text'),type:'textarea',placeholder:L('Energia 2256 kJ / 544 kcal\nZsír 35,5 g\nSzénhidrát 51 g\nFehérje 4,9 g','Energy 2256 kJ / 544 kcal\nFat 35.5 g\nCarbohydrate 51 g\nProtein 4.9 g'),hint:L('iPhone-on a Kamera vagy a Fotók app „Szöveg” funkciójával, Androidon a Google Lens „Szöveg” → Másolás funkciójával kimásolhatod a címke szövegét. Ez sokszor pontosabb, mint a fotó.','On iPhone, use Live Text in Camera or Photos; on Android, Google Lens “Text” → Copy. This is often more accurate than the photo reader.')}],{ok:L('Feldolgozás','Process')});
  if(r)mfOcrApply(r.t||'',L('A beillesztett szövegből','From the pasted text'))}
function mfOcrApply(txt,from){const v=labelParse(txt),got=['kcal','p','c','f','fib'].filter(k=>v[k]!=null);
  if(got.length<3){mf.ocr={msg:L('Nem találtam elég tápértéket. Tipp: a tápértéktáblát egyenesen, közelről, jó fényben fotózd úgy, hogy csak a táblázat legyen a képen; íves palacknál fordítsd a táblázatot a kamera felé, vagy használd a Szöveg beillesztése gombot.','I couldn’t find enough values. Tip: photograph the table straight on, close up, in good light, with only the table in the frame; on a curved bottle turn the table to face the camera, or use Paste text.'),bad:true};renderMF();return}
  for(const k of ['kcal','p','c','f','fib'])if(v[k]!=null)mf.per[k]=String(v[k]).replace('.',LANG==='en'?'.':',');
  if(v.kcal==null)mf.per.kcal=String(Math.round(euKcal({p:v.p||0,c:v.c||0,f:v.f||0,fib:v.fib||0})));
  const ex=[v.sug!=null&&L(`cukor ${fmt1(v.sug)} g`,`sugar ${fmt1(v.sug)} g`),v.sat!=null&&L(`telített zsír ${fmt1(v.sat)} g`,`saturated fat ${fmt1(v.sat)} g`),v.salt!=null&&L(`só ${fmt1(v.salt)} g`,`salt ${fmt1(v.salt)} g`)].filter(Boolean);
  const off=v.kcal!=null&&v.err>0.12;
  mf.ocr={msg:`${from} ${L('kitöltöttem az értékeket','I filled in the values')}${ex.length?` (${L('a címkén még','also on the label')}: ${ex.join(', ')} – ${L('ezeket az app nem tárolja','the app doesn’t store these')})`:''}. ${off?L('Az energia és a makrók nem egészen egyeznek – nézd át a címkével!','Energy and macros don’t quite match – check against the label!'):L('Mentés előtt vesd össze a címkével.','Check against the label before saving.')}`,bad:off};
  renderMF()}

function readOwnFood(r){const o={name:r.name.slice(0,80),unit:r.unit==='ml'?'ml':'g'};const e=String(r.ean||'').replace(/\D/g,'');if(/^\d{8,14}$/.test(e))o.ean=e;for(const k of['p','c','f','fib','alc'])o[k]=Math.max(0,Math.min(100,parseMacro(r[k])||0));const k=parseMacro(r.kcal);o.kcal=k==null?euKcal(o):Math.max(0,Math.min(1000,Math.round(k)));return o}

let qMeal=null,qFreq=[],qGroups=[];
function quickLog(){qMeal=foodDate===today()?guessMeal():'ebed';const lim=ymd(new Date(Date.now()-90*DAY)),cnt=new Map();
  for(const m of S.meals){if(m.date<lim)continue;const k=deacc(m.name)+'|'+m.kcal,c=cnt.get(k);if(c){c.n++;if(m.date>c.m.date)c.m=m}else cnt.set(k,{n:1,m})}
  qFreq=[...cnt.values()].filter(x=>x.n>=1).sort((a,b)=>b.n-a.n||(a.m.date<b.m.date?1:-1)).slice(0,12).map(x=>x.m);
  const g=new Map();for(const m of S.meals){if(m.date===foodDate||m.date<ymd(new Date(Date.now()-14*DAY)))continue;const k=m.date+'|'+m.meal;(g.get(k)||g.set(k,[]).get(k)).push(m)}
  qGroups=[...g.entries()].sort((a,b)=>a[0]<b[0]?1:-1).slice(0,8).map(([k,items])=>({date:k.split('|')[0],meal:k.split('|')[1],items}));
  renderQuick()}

  openModal(`<h2>Gyors rögzítés</h2><div class="hint" style="margin-top:-4px">${esc(fmtDate(foodDate))} · ${L(`korábbi étkezések és gyakori tételek, ${AI()} nélkül`,`earlier meals and frequent items, without ${AI()}`)}</div>
  ${qGroups.length?`<div class="grp">Korábbi étkezések</div>${qGroups.map((g,i)=>`<div class="qrow"><span><b>${esc(mealLbl(g.meal))}</b> <span class="mut small">· ${esc(relDay(pYmd(g.date).getTime()))}</span><br><span class="small mut">${esc(g.items.map(m=>m.name).join(' · '))}</span></span><span class="mono small">${fmt(sumMeals(g.items).kcal,0)}</span><button class="btn sm" data-click="copyGroup(${i})">Ismét</button></div>`).join('')}`:''}
  ${qFreq.length?`<div class="grp">Gyakori tételek</div><label for="qmeal" style="margin-top:0">Étkezés</label><select id="qmeal" data-change="qMealSet(this.value)">${MEALS.map(([k,l])=>`<option value="${k}" ${k===qMeal?'selected':''}>${l}</option>`).join('')}</select>
  <input id="qq" type="search" autocomplete="off" style="margin-top:10px" placeholder="${L('Keresés a korábbi tételeid között…','Search your earlier items…')}" data-input="qSearch(this.value)"><div id="qlist">${qRows(qFreq)}</div>`:''}
  ${!qGroups.length&&!qFreq.length?'<div class="empty">Még nincs korábbi étkezés.</div>':''}

function adaptive(){const t=targets();if(!t.tdee||!t.adult)return null;
  const td=today(),start=ymd(new Date(pYmd(td).getTime()-28*DAY)),byDay={};
  for(const m of S.meals)if(m.date>=start&&m.date<td)byDay[m.date]=(byDay[m.date]||0)+(m.kcal||0);
  const logged=Object.values(byDay).filter(k=>k>=800);
  const ws=series('weight').filter(p=>p.x>=pYmd(start).getTime()),span=ws.length?(ws[ws.length-1].x-ws[0].x)/DAY:0;
  if(logged.length<14||ws.length<8||span<14)return{ready:false,days:logged.length,weights:ws.length,span:Math.round(span)};
  const avgIn=logged.reduce((a,b)=>a+b,0)/logged.length,slope=slopeWeek(ws);if(slope==null)return{ready:false,days:logged.length,weights:ws.length,span:Math.round(span)};

  /* Biztonsági korlát: a becslés az alapanyagcsere alatt valószínűleg hiányos rögzítést jelez – ilyenkor nem javaslunk csökkentést;
     és a keret soha nem megy a minimum, illetve a képlet szerinti energiaigény 70%-a alá. */
  const suspect=tdeeA<t.bmr,low=Math.max(t.floor,r5(t.tdee*.7)),ideal=Math.max(low,r5(tdeeA+t.adj));
  let step=Math.max(low,Math.max(cur-250,Math.min(cur+250,ideal)));if(suspect&&step<cur)step=cur;
  return{ready:true,days:logged.length,avgIn:Math.round(avgIn),slope,tdeeA,ideal,cur,step:r5(step),diff:r5(step)-cur,suspect}}

function vMethods(){const en=LANG==='en',X=(h,e)=>en?e:h,f=v=>String(v).replace('.',en?'.':',');

  ${fx(X('Fehérje = referencia-testsúly × g/ttkg\n  referencia-testsúly = min(súly, 27,5 × magasság(m)²)\nZsír = keret × zsírarány ÷ 9, de legalább 0,6 g/ttkg\nSzénhidrát = (keret − fehérje × 4 − zsír × 9) ÷ 4\nRost = keret ÷ 1000 × 14 g, de legalább 25 g\nEnergiatartalom: fehérje és szénhidrát 4, zsír 9 kcal/g','Protein = reference weight × g/kg\n  reference weight = min(weight, 27.5 × height(m)²)\nFat = target × fat share ÷ 9, but at least 0.6 g/kg\nCarbs = (target − protein × 4 − fat × 9) ÷ 4\nFiber = target ÷ 1000 × 14 g, but at least 25 g\nEnergy: protein and carbs 4, fat 9 kcal/g'))}

  +sec(X('Adaptív keret','Adaptive target'),`${fx(X('Tényleges energiaigény = átlagos bevitel − súlytrend (kg/hét) × 7700 ÷ 7\n\nFeltétel: az elmúlt 28 napból ≥ 14 rögzített nap (≥ 800 kcal),\n          ≥ 8 mérés legalább 14 nap alatt\nÚj keret = tényleges energiaigény + célkorrekció\nLépésenként legfeljebb ±250 kcal; alsó korlát: a minimum és a képlet szerinti\nenergiaigény 70%-a közül a nagyobb\nHa a becslés a BMR alatt van (valószínűleg hiányos napló), nem javasol csökkentést','Actual energy needs = average intake − weight trend (kg/week) × 7700 ÷ 7\n\nRequires: in the last 28 days ≥ 14 logged days (≥ 800 kcal),\n          ≥ 8 weigh-ins over at least 14 days\nNew target = actual energy needs + goal adjustment\nAt most ±250 kcal per step; lower limit: the larger of the minimum and\n70% of the formula energy needs\nIf the estimate is below BMR (probably incomplete log), no decrease is suggested'))}

  +sec(X('Összesítő trend és összefüggések','Combined trend and correlations'),`${fx(X('Simítás: testsúly, étkezés, lépés 7 napos, testzsír 21 napos átlag\nÖsszevetés: z = (érték − átlag) ÷ szórás, ±2,5-re vágva\nÖsszefüggés: Pearson-féle korrelációs együttható (r), legalább 20 közös nap\n  |r| < 0,2 elhanyagolható · < 0,4 gyenge · < 0,6 közepes · ≥ 0,6 erős','Smoothing: weight, food, steps 7-day, body fat 21-day average\nComparison: z = (value − mean) ÷ standard deviation, clipped to ±2.5\nCorrelation: Pearson correlation coefficient (r), at least 20 shared days\n  |r| < 0.2 negligible · < 0.4 weak · < 0.6 moderate · ≥ 0.6 strong'))}

  +sec(X('Források','Sources'),`<ul class="refs">

function tplCats(){const {lastOf}=lastUse(),cats=[];
  const arch=S.templates.filter(t=>t.archived).sort((a,b)=>(lastOf[b.id]||0)-(lastOf[a.id]||0));
  const fresh=S.templates.filter(t=>!lastOf[t.id]&&!t.archived).map((t,i)=>[t,i]).sort((a,b)=>tplRank(a[0])-tplRank(b[0])||a[1]-b[1]).map(x=>x[0]);
  if(arch.length)cats.push({id:'arch',label:'Korábbi edzéseim',list:arch});
  const plans=[...new Set(fresh.filter(t=>t.plan).map(t=>t.plan))].sort((a,b)=>a.localeCompare(b,'hu'));
  plans.forEach((p,i)=>cats.push({id:'p'+i,label:p,list:fresh.filter(t=>t.plan===p)}));
  for(const k of TAG_ORDER){const l=fresh.filter(t=>!t.plan&&tplKey(t)===k);if(l.length)cats.push({id:k,label:TAGS[k][1],list:l})}
  const o=fresh.filter(t=>!t.plan&&!tplKey(t));if(o.length)cats.push({id:'_',label:'Egyéb',list:o});
  return cats}

/* ===== Profil, célok, javasolt energia- és makrócél =====
   BMR: Mifflin–St Jeor. TDEE = BMR × aktivitási szorzó. Cél = TDEE + célhoz tartozó korrekció.
   Fehérje: g/ttkg a cél szerint (túlsúlynál BMI 27,5-höz tartozó referencia-testsúllyal), zsír: az energia 25–30%-a
   (legalább 0,6 g/ttkg), szénhidrát: a maradék. Alsó határ: nő 1200, férfi 1500 kcal. */

const GOAL_L={lose:['Fogyás','Weight loss'],maintain:['Szinten tartás','Maintenance'],muscle:['Izomépítés','Muscle gain'],gain:['Hízás','Weight gain']};
const ADJ={lose:[-300,-500,-750],maintain:[0,0,0],muscle:[150,250,400],gain:[300,500,700]};

const r5=v=>Math.round(v/50)*50;
function targets(){
  const p=S.profile||{},w=lastWeight(),age=p.birthYear?new Date().getFullYear()-p.birthYear:null,goal=p.goal||'maintain';
  const missing=[];if(!p.sex)missing.push(L('nem','sex'));if(!p.birthYear)missing.push(L('születési év','birth year'));if(!p.height)missing.push(L('magasság','height'));if(!p.activity)missing.push(L('aktivitás','activity'));if(!w)missing.push(L('testsúly','body weight'));
  const t={missing,goal,w,age,adult:age==null||age>=18};
  if(!missing.length&&t.adult){
    t.bmr=Math.round(10*w+6.25*p.height-5*age+(p.sex==='m'?5:-161));
    t.tdee=Math.round(t.bmr*p.activity);

    if(t.suggested<t.floor){t.suggested=t.floor;t.floored=true}
  }
  t.kcal=p.kcalOverride||t.suggested||null;t.custom=!!p.kcalOverride;
  if(t.kcal){
    const refW=w?(p.height?Math.min(w,27.5*(p.height/100)**2):w):null;
    t.p=refW?Math.round(refW*PPK[goal]):Math.round(t.kcal*.25/4);
    t.f=Math.round(t.kcal*FATPCT[goal]/9);if(w)t.f=Math.max(t.f,Math.round(.6*w));
    t.c=Math.max(0,Math.round((t.kcal-t.p*4-t.f*9)/4));

  }
  return t;
}

/* Egészséges súlytartomány:
   – BMI 18,5–24,9 (WHO) a magasságból; az alsó határ figyelmeztetés, a felső izmos testalkatnál félrevezető;
   – ha van testzsírmérés (az utolsó mérés előtti 21 nap átlaga): zsírmentes tömeg = súly × (1 − testzsír%),
     súly adott testzsírhoz = zsírmentes tömeg ÷ (1 − cél%), feltéve, hogy az izomtömeg megmarad;
   – egészséges testzsír: férfi 10–25%, nő 18–32%; a cél nem mehet férfinál 8%, nőnél 15% alá (a létfontosságú zsír fölött tartalékkal);
   – FFMI = zsírmentes tömeg ÷ magasság² (tájékoztató). */

  if(r.lean&&tw<=r.lean)return{lvl:'bad',txt:L(`A célsúly kisebb, mint a mostani zsírmentes tömeged (${k(r.lean)} kg: izom, csont, víz, szervek), így csak izom- és szervtömeg elvesztésével lenne elérhető. Ilyen célt csak orvossal egyeztetve tűzz ki.`,`Your target weight is below your current lean mass (${k(r.lean)} kg: muscle, bone, water, organs), so it could only be reached by losing muscle and organ mass. Only set a target like this after talking to a doctor.`)};
  if(r.lean&&tw<r.minW)return{lvl:'bad',txt:L(`A mostani zsírmentes tömegeddel (${k(r.lean)} kg) ehhez a célsúlyhoz ${hu(Math.max(0,(1-r.lean/tw)*100),0)}% körüli testzsír tartozna, ami a biztonságos szint (${BF_MIN[S.profile.sex]}%) alatt van. Ilyen célt csak orvossal egyeztetve tűzz ki.`,`With your current lean mass (${k(r.lean)} kg), this target means about ${hu(Math.max(0,(1-r.lean/tw)*100),0)}% body fat, below the safe level (${BF_MIN[S.profile.sex]}%). Only set a target like this after talking to a doctor.`)};
  if(r.lean){const bf=(1-r.lean/tw)*100;if(bf>r.bfOk[1])return{lvl:'note',txt:L(`Ehhez a célsúlyhoz a mostani zsírmentes tömegeddel kb. ${hu(bf,0)}% testzsír tartozna; az egészséges tartomány ${r.bfOk[0]}–${r.bfOk[1]}%.`,`At this target, with your current lean mass, body fat would be about ${hu(bf,0)}%; the healthy range is ${r.bfOk[0]}–${r.bfOk[1]}%.`)};return null}
  if(tw>r.hi)return{lvl:'note',txt:L(`A célsúly a 24,9-es BMI fölött van (${k(r.hi)} kg fölött). Izmos testalkatnál a BMI nem megbízható: egy testzsírmérés pontosabb képet ad.`,`Your target weight is above a BMI of 24.9 (over ${k(r.hi)} kg). BMI isn’t reliable for a muscular build: a body-fat measurement gives a clearer picture.`)};
  return null}

/* ===== Étkezés ===== */
const MEALS=[['reggeli','Reggeli'],['tizorai','Tízórai'],['ebed','Ebéd'],['uzsonna','Uzsonna'],['vacsora','Vacsora'],['nasi','Nasi / egyéb']];
const mealLbl=k=>(MEALS.find(m=>m[0]===k)||MEALS[5])[1];
const deacc=t=>String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function mealKey(t){t=deacc(t).trim();if(/^(regg|breakf)/.test(t))return'reggeli';if(/^(tiz|brunch|morning)/.test(t))return'tizorai';if(/^(ebed|lunch)/.test(t))return'ebed';if(/^(uzs|afternoon)/.test(t))return'uzsonna';if(/^(vacs|dinner|supper)/.test(t))return'vacsora';return'nasi'}
function guessMeal(){const h=new Date().getHours();return h<10?'reggeli':h<12?'tizorai':h<15?'ebed':h<18?'uzsonna':h<22?'vacsora':'nasi'}
let foodDate=today();
const dayMeals=d=>S.meals.filter(m=>m.date===d);
const sumMeals=l=>l.reduce((a,m)=>({kcal:a.kcal+m.kcal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f,fib:a.fib+(m.fib||0)}),{kcal:0,p:0,c:0,f:0,fib:0});
const DATE_HEAD=/^(\d{4})\s*[-./]\s*([0-9]{1,2}|[A-Za-zÁÉÍÓÖŐÚÜŰáéíóöőúüű]{3,10}\.?)\s*[-./]?\s*(\d{1,2})\.?/;
function parseDateStr(t){const m=DATE_HEAD.exec(String(t).trim());if(!m)return null;const mo=monthNum(m[2]);if(!mo||mo>12)return null;
  const d=`${m[1]}-${z2(mo)}-${z2(+m[3])}`,dt=pYmd(d);return dt.getMonth()===mo-1&&dt<=new Date()?d:null}
function parseMacro(t){t=String(t??'').replace(/[\s ]/g,'').replace(/^[^\d]+/,'').replace(/[^\d.,]+$/,'');if(!t)return null;if(/^\d{1,3}([.,]\d{3})+$/.test(t))t=t.replace(/[.,]/g,'');else t=t.replace(',','.');const v=parseFloat(t);return isFinite(v)?Math.round(v*10)/10:null}
/* Formátum soronként: ÉÉÉÉ-HH-NN;étkezés;megnevezés;kcal;fehérje;szénhidrát;zsír  (a dátum elhagyható) */
/* Formátum soronként: ÉÉÉÉ-HH-NN;étkezés;megnevezés;kcal;fehérje;szénhidrát;zsír;rost
   A dátum elhagyható (ilyenkor a kiválasztott nap), a rost is (régebbi, 7 mezős sorok). */
function parseMeals(text,defDate){
  const out=[];
  for(const raw of String(text||'').split(/\r?\n/)){
    const line=raw.trim().replace(/^[-*•]\s*/,'');if(!line||!line.includes(';'))continue;
    let parts=line.split(';').map(x=>x.trim());while(parts.length&&parts[parts.length-1]==='')parts.pop();
    let date=parseDateStr(parts[0]);const ex=!!date;if(date)parts=parts.slice(1);else date=defDate;
    // a sor végén lévő számmezők: 5 = kcal,F,Sz,Zs,rost; 4 = rost nélkül
    const isNum=t=>{const u=t.replace(/\s*(kcal|kj|gramm|gr|g)\.?$/i,'').trim();return /\d/.test(u)&&/^[\d\s.,\u00a0]+$/.test(u)};
    let k=0;for(let j=parts.length-1;j>=0&&k<5&&isNum(parts[j]);j--)k++;
    if(k<4||parts.length-k<2)continue;
    const nums=parts.slice(-k).map(parseMacro),[kcal,p,c,f]=nums,fib=k===5?nums[4]:null;
    const name=parts.slice(1,parts.length-k).join(' ').slice(0,100);
    if(!name||kcal<0||kcal>10000||[p,c,f].some(x=>x<0||x>1000)||(fib!=null&&(fib<0||fib>500)))continue;
    out.push({date,meal:mealKey(parts[0]),name,kcal:Math.round(kcal),p,c,f,fib,ex});
  }
  return out;
}
function pasteMeals(){return claudePaste()}
async function pasteMealsGo(text){
  let items=parseMeals(text,foodDate);if(!items.length)return;
  /* Korábbi napra szóló (dátummal kimásolt) tételek: rákérdezünk, mára vegyük-e fel a mostani napszak szerinti étkezésként. */
  const td=today(),old=items.filter(m=>m.ex&&m.date<td);
  if(old.length){const nm=guessMeal(),ds=[...new Set(old.map(m=>fmtDate(m.date)))].join(', ');
    const r=await form('Korábbi dátum',[{id:'mode',label:'Hova kerüljenek?',type:'select',value:'today',options:[['today',L(`Mára, ${mealLbl(nm).toLowerCase()} étkezésként`,`Today, as ${T(mealLbl(nm))}`)],['keep',L('Az eredeti napra','To the original day')]]}],
      {ok:'Tovább',intro:L(`${old.length} tétel korábbi napra szól (${ds}).`,`${old.length} item${old.length>1?'s are':' is'} dated to an earlier day (${ds}).`)});
    if(!r)return;if(r.mode==='today')for(const m of old){m.date=td;m.meal=nm}}
  /* Már rögzített tétel: figyelmeztetünk, de mégis felvehető (pl. ugyanazt kétszer etted). */
  const key=m=>[m.date,m.meal,deacc(m.name),m.kcal].join('|'),have=new Set(S.meals.map(key));
  const dups=items.filter(m=>have.has(key(m)));let fresh=items;
  if(dups.length){
    const ok=await ask(dups.slice(0,8).map(m=>`<div class="exl"><span>${esc(m.name)}<br><span class="mut small">${fmtDate(m.date)} · ${mealLbl(m.meal)}</span></span><span>${m.kcal} kcal</span></div>`).join('')+`<div class="hint">${L('Ugyanezzel a dátummal, étkezéssel és kalóriával már szerepel. Ha tényleg még egyszer etted, rögzítsd újra.','Already logged with the same date, meal and calories. If you really ate it again, log it again.')}</div>`,
      {title:L(`${dups.length} tétel már szerepel`,`${dups.length} item${dups.length>1?'s':''} already logged`),ok:'Mégis rögzítem',cancel:'Kihagyom'});
    if(!ok)fresh=items.filter(m=>!have.has(key(m)));
  }
  if(!fresh.length){toast('Nem maradt rögzítendő tétel');return}
  const sum=sumMeals(fresh);
  const list=fresh.slice(0,12).map(m=>`<div class="exl"><span>${esc(m.name)}<br><span class="mut small">${fmtDate(m.date)} · ${mealLbl(m.meal)}</span></span><span>${m.kcal} kcal</span></div>`).join('')+(fresh.length>12?`<div class="mut small">… és még ${fresh.length-12} tétel</div>`:'');
  if(!await ask(`${list}<div class="exl"><b>Összesen</b><span><b>${fmt(sum.kcal,0)} kcal</b> · F ${fmt(sum.p,0)} · Sz ${fmt(sum.c,0)} · Zs ${fmt(sum.f,0)} · R ${fmt(sum.fib,0)} g</span></div>`,{title:`${fresh.length} tétel mentése`,ok:'Mentés'}))return;
  for(const m of fresh){const x=Object.assign({id:uid()},m);delete x.ex;S.meals.push(x)}
  foodDate=fresh[fresh.length-1].date;save();go('food');toast(`${fresh.length} tétel mentve`);
}
function mealFields(m={}){return[{id:'meal',label:'Étkezés',type:'select',value:m.meal||guessMeal(),options:MEALS},{id:'name',label:'Megnevezés',value:m.name||'',placeholder:'pl. Zabkása 60 g banánnal'},
  {id:'kcal',label:'Energia (kcal)',type:'number',value:m.kcal??''},{id:'p',label:'Fehérje (g)',type:'number',value:m.p??''},{id:'c',label:'Szénhidrát (g)',type:'number',value:m.c??''},{id:'f',label:'Zsír (g)',type:'number',value:m.f??''},{id:'fib',label:'Rost (g)',type:'number',value:m.fib??''}]}

const REC_TAG=[['soup','Leves','Soup'],['salad','Saláta','Salad'],['protein','Magas fehérjetartalmú','High protein'],['fiber','Magas rosttartalmú','High fibre'],['dessert','Desszert','Dessert']];

/* A Claude-nak adott formátum (betöltéshez és a receptötletekhez is) */
function recipeFormat(L2){return L2(`Formátum: egyetlen kódblokk, amelynek első sora \`olupan-recipes\`, utána egy JSON-tömb. Receptenként:
{"name": "Recept neve", "aliases": ["becenév"], "servings": 2, "time": 25, "difficulty": "könnyű",
 "meal": ["breakfast"|"lunch"|"dinner"|"snack"], "cuisine": [${PREF_CUISINE.map(c=>'"'+c[0]+'"').join('|')}],
 "tags": ["soup"|"salad"|"protein"|"fiber"|"dessert"], "style": ["quick"|"few"|"prep"|"handsoff"], "season": ["spring"|"summer"|"autumn"|"winter"],
 "ingredients": [{"name": "zabpehely", "qty": 50, "unit": "g", "cat": "dry"}], "steps": ["1. lépés szövege", "2. lépés szövege"],
 "per_serving": {"grams": 380, "kcal": 420, "protein": 30, "carbs": 45, "fat": 12, "fiber": 6}}
A "grams" egy adag kész étel tömege grammban (köret nélkül, ha a köret külön készül): a nyers hozzávalók összsúlyából számold átlagos főzési veszteséggel (párolgás, sütési veszteség, a hús víz- és zsírvesztése), osztva az adagszámmal – ezt mérem ki a tányérra. A nevek, hozzávalók és lépések magyarul legyenek; a mennyiségek számok (g, ml, db, ek, tk, csipet). A "time" percben értendő. Szezonális receptnél a "season" az évszak(ok), egész évben elkészíthetőnél üres. A "protein" címke 25 g feletti, a "fiber" 8 g feletti adagonkénti értéknél jár. A szénhidrát rost nélkül értendő (EU-s címke szerint). A "cat" a hozzávaló áruházi csoportja: ${SHOP_CAT_HELP_HU}. Magyarországon könnyen kapható hozzávalókat használj: folyékony tojásfehérje helyett tojásfehérjét darabban (pl. "tojásfehérje", 6 db).`,
`Format: a single code block whose first line is \`olupan-recipes\`, followed by a JSON array. For each recipe:
{"name": "Recipe name", "aliases": ["nickname"], "servings": 2, "time": 25, "difficulty": "easy",
 "meal": ["breakfast"|"lunch"|"dinner"|"snack"], "cuisine": [${PREF_CUISINE.map(c=>'"'+c[0]+'"').join('|')}],
 "tags": ["soup"|"salad"|"protein"|"fiber"|"dessert"], "style": ["quick"|"few"|"prep"|"handsoff"], "season": ["spring"|"summer"|"autumn"|"winter"],
 "ingredients": [{"name": "rolled oats", "qty": 50, "unit": "g", "cat": "dry"}], "steps": ["Step 1 text", "Step 2 text"],
 "per_serving": {"grams": 380, "kcal": 420, "protein": 30, "carbs": 45, "fat": 12, "fiber": 6}}
"grams" is the weight of one serving of the finished dish (without the side if it’s cooked separately): work it out from the total raw weight with average cooking losses (evaporation, roasting loss, water and fat loss from meat), divided by the servings – this is what I weigh onto the plate. Write names, ingredients and steps in English; quantities as numbers (g, ml, pcs, tbsp, tsp, pinch). "time" is in minutes. For seasonal recipes "season" lists the season(s); leave it empty for all-year recipes. The "protein" tag needs over 25 g, "fiber" over 8 g per serving. Carbohydrates exclude fibre (as on EU labels). "cat" is the ingredient's supermarket section: ${SHOP_CAT_HELP_EN}. Use ingredients easy to get in Hungary: egg whites by count instead of liquid egg white (e.g. "egg white", 6 pcs).`)}
function recSan(o){if(!o||typeof o!=='object')return null;const name=str(o.name||'',100).trim();if(!name)return null;
  const arr=(v,ok,n=12)=>(Array.isArray(v)?v:[]).map(x=>String(x).toLowerCase().trim()).filter(x=>!ok||ok.includes(x)).slice(0,n);
  const st0=arr(o.style,null).map(x=>({'few-ingredients':'few','make-ahead':'prep','hands-off':'handsoff'}[x]||x));
  const tg0=arr(o.tags,null).map(x=>({'high-protein':'protein','high-fiber':'fiber','high-fibre':'fiber'}[x]||x));
  const ps=o.per_serving||o.ps||{};const n=v=>{v=num(v,0,5000);return v==null?null:Math.round(v*10)/10};
  return{id:typeof o.id==='string'&&/^r[A-Za-z0-9_-]{1,40}$/.test(o.id)?o.id:'r'+uid(),name,aliases:arr(o.aliases,null,6).map(x=>str(x,60)),serv:Math.max(1,Math.min(50,Math.round(num(o.servings??o.serv,1,50)||1))),
    time:num(o.time,0,1440)!=null?Math.round(o.time):null,diff:str(o.difficulty||o.diff||'',30),
    meal:arr(o.meal,REC_MEAL.map(a=>a[0])),cuisine:arr(o.cuisine,PREF_CUISINE.map(a=>a[0])),tags:[...new Set(tg0.filter(x=>REC_TAG.some(a=>a[0]===x)))],
    style:[...new Set(st0.filter(x=>['quick','few','prep','handsoff'].includes(x)))],season:arr(o.season,REC_SEASON.map(a=>a[0]),4),
    ing:(Array.isArray(o.ingredients??o.ing)?(o.ingredients??o.ing):[]).slice(0,60).map(i=>typeof i==='string'?{n:str(i,120),q:null,u:''}:((c)=>Object.assign({n:str(i.name??i.n??'',120),q:num(i.qty??i.q,0,100000),u:str(i.unit??i.u??'',20)},SHOP_CAT_KEYS.includes(c)?{cat:c}:{}))(i.cat??i.aisle)).filter(i=>i.n),
    steps:(Array.isArray(o.steps)?o.steps:[]).slice(0,40).map(x=>str(String(x).replace(/^\s*\d+[.)]\s*/,''),600)).filter(Boolean),
    g:(v=>v==null?null:Math.round(v))(num(ps.grams??ps.g??o.g,10,3000)),kcal:n(ps.kcal??o.kcal),p:n(ps.protein??o.p),c:n(ps.carbs??o.c),f:n(ps.fat??o.f),fib:n(ps.fiber??ps.fibre??o.fib),
    vote:o.vote===1||o.vote===-1?o.vote:0,note:str(o.note||'',1000),added:DATE_RE.test(o.added)?o.added:today()}}
/* Ha a modell nem adott "grams" értéket, de a szövegben leírta (pl. „Egy adag (1 fő): kb. 1/8 rész, kb. 430 g”), azt használjuk */
function recTextGrams(r){for(const t of[r.note||'',...(r.steps||[])]){const m=String(t).match(/(?:adag|serving)[^\n]{0,80}?\b(\d{2,4})\s*(?:g|gramm|grams?)\b/i);if(m){const g=+m[1];if(g>=80&&g<=3000)return g}}return null}
function parseRecipes(t){t=String(t||'');const m=t.match(/```\s*olupan-recipes\s*\n([\s\S]*?)```/)||t.match(/olupan-recipes\s*\n([\s\S]*)/);let j=m?m[1]:t;
  const a=j.indexOf('['),b=j.lastIndexOf(']');if(a<0||b<a)return null;try{const d=JSON.parse(j.slice(a,b+1));return Array.isArray(d)?d.map(recSan).filter(Boolean).map(r=>(r.g||(r.g=recTextGrams(r)),r)):null}catch(e){return null}}
const REC_MAX=500;
function importRecipes(list){S.recipes=S.recipes||[];let add=0,upd=0,skip=0;
  for(const r of list){const k=deacc(r.name),ex=S.recipes.find(x=>deacc(x.name)===k);
    if(ex){Object.assign(ex,r,{id:ex.id,vote:ex.vote,note:ex.note,added:ex.added});upd++}else if(S.recipes.length<REC_MAX){S.recipes.push(r);add++}else skip++}
  save();if(skip)setTimeout(()=>toast(L(`${skip} recept nem fért el (legfeljebb ${REC_MAX})`,`${skip} recipe${skip>1?'s':''} didn’t fit (max ${REC_MAX})`)),1600);return[add,upd]}

async function recDelDown(){const l=(S.recipes||[]).filter(r=>r.vote===-1);if(!l.length)return;if(!await ask(L(`Törlöd a ${l.length} leszavazott receptet?`,`Delete the ${l.length} disliked recipe${l.length>1?'s':''}?`),{title:L('Leszavazottak törlése','Delete disliked'),ok:L('Törlés','Delete'),danger:true}))return;
  const ids=new Set(l.map(r=>r.id));S.recipes=S.recipes.filter(r=>!ids.has(r.id));S.shop=(S.shop||[]).filter(x=>!ids.has(x.rid));for(const mm of[S.menu,S.menuNext])if(mm)for(const x of mm.slots)if(ids.has(x.rid))x.rid=null;save();render();toast(L('Törölve','Deleted'))}
/* Recept-ellenőrzés (receptötletek, egy recept, menü receptjei): hiányos adat, a kalória és a makrók ellentmondása, a névben szereplő fő alapanyag
   hiánya a hozzávalók közül, a címke és az érték ellentmondása. A tápértéket nem számoljuk újra, csak a belső ellentmondásokat jelezzük. */
const REC_KEY=[['gorog joghurt',['gorog joghurt']],['joghurt',['joghurt']],['turo',['turo']],['csirke',['csirke']],['pulyka',['pulyka']],['marha',['marha']],['sertes',['sertes']],['lazac',['lazac']],['tonhal',['tonhal']],['tofu',['tofu']],['csicseri',['csicseri']],['lencse',['lencse']],['tojas',['tojas']],['rizs',['rizs']],['teszta',['teszta','orzo','spagetti','penne','fusilli','soba','udon','makaroni','lasagne']],['burgonya',['burgonya','krumpli']],['sutotok',['sutotok']],['spenot',['spenot']],['gomba',['gomba','csiperke']],['feta',['feta']],['zab',['zab']],
 ['greek yogurt',['greek yogurt','greek yoghurt']],['chicken',['chicken']],['turkey',['turkey']],['salmon',['salmon']],['tuna',['tuna']],['chickpea',['chickpea']],['lentil',['lentil']],['egg',['egg']],['rice',['rice']],['pasta',['pasta','orzo','spaghetti','penne','noodle']],['potato',['potato']],['spinach',['spinach']],['mushroom',['mushroom']],['oat',['oat']]];
const REC_KEY_HU={'gorog joghurt':'görög joghurt','turo':'túró','sertes':'sertés','tojas':'tojás','teszta':'tészta','sutotok':'sütőtök','spenot':'spenót'};
function recCheck(r){const o=[],nm=deacc(r.name),ing=r.ing.map(i=>deacc(i.n));
  if(!r.ing.length)o.push(L('nincsenek hozzávalók','no ingredients'));if(!r.steps.length)o.push(L('nincs elkészítés','no method'));
  if(r.kcal==null||r.p==null)o.push(L('hiányzik az adagonkénti tápérték','per-serving nutrition missing'));
  const nq=r.ing.filter(i=>i.q==null&&i.cat!=='spice').map(i=>i.n);if(nq.length)o.push(L('mennyiség nélkül: ','no amount: ')+nq.join(', '));
  if(r.kcal!=null&&r.p!=null){const est=4*(r.p||0)+4*(r.c||0)+9*(r.f||0)+2*(r.fib||0);if(Math.abs(est-r.kcal)>Math.max(40,r.kcal*.15))o.push(L(`a kalória (${fmt(r.kcal,0)}) nem egyezik a makrókból számolt kb. ${fmt(est,0)} kcal-lal`,`calories (${fmt(r.kcal,0)}) don’t match the about ${fmt(est,0)} kcal from the macros`))}
  const seen=new Set();for(const[k,alts]of REC_KEY){if(!nm.includes(k)||[...seen].some(x=>x.includes(k)))continue;seen.add(k);if(r.ing.length&&!ing.some(i=>alts.some(a=>i.includes(a)))){const w=REC_KEY_HU[k]||k;o.push(L(`a névben szereplő „${w}” nincs a hozzávalók között`,`“${w}” in the name isn’t among the ingredients`))}}
  if(r.tags.includes('protein')&&r.p!=null&&r.p<=25)o.push(L(`magas fehérjésnek jelölt, de adagonként csak ${fmt(r.p,0)} g fehérje`,`tagged high protein but only ${fmt(r.p,0)} g protein per serving`));
  if(r.tags.includes('fiber')&&r.fib!=null&&r.fib<=8)o.push(L(`magas rostosnak jelölt, de adagonként csak ${fmt(r.fib,0)} g rost`,`tagged high fibre but only ${fmt(r.fib,0)} g fibre per serving`));
  return o}
function recIssues(list){return list.map(r=>[r,recCheck(r)]).filter(x=>x[1].length)}
let recFixList=null;
/* Hibák keretben, a javításkérés a kiemelt (fő) gomb. A build engedélylistájához: data-click="planFix" data-click="menuFix" data-click="recFix" data-click="menuAck" */
function issBox(title,lis,fix,note,acc){return`<div class="issbox" role="alert"><div class="isshd">${I('triangle-alert','sm')}<span>${title}</span></div><ul>${lis.join('')}</ul>${note?`<div class="issnote">${note}</div>`:''}${fix?`<button class="btn p" data-click="${fix}">${I('external-link','sm')} ${L(`Javítás kérése: ${AI()}`,`Ask ${AI()} to fix it`)}</button>`:''}${acc?`<button class="btn" style="width:100%;justify-content:center;margin-top:8px" data-click="${acc}">${I('check','sm')} ${L('Elfogadom így','Accept as is')}</button>`:''}</div>`}
function recIssuesHtml(iss,fix){return issBox(L('Néhány receptnél ellentmondást találtam','I found inconsistencies in some recipes'),iss.map(([r,x])=>`<li><b>${esc(r.name)}</b>: ${esc(x.join('; '))}</li>`),fix)}
function recFix(){const iss=recFixList;if(!iss||!iss.length)return;closeModal();const en=LANG==='en',L2=(h,e)=>en?e:h,t=targets();
  claudeGo('one',[L2('Ezekben a receptekben ellentmondást találtam. Kérlek, javítsd őket, és add vissza a teljes recepteket pontosan ugyanezzel a névvel. Az adagonkénti értékeket a hozzávalók grammjaiból számold, és a név ne mondjon mást, mint a hozzávalólista.','I found inconsistencies in these recipes. Please fix them and give back the full recipes with exactly the same names. Work out the per-serving values from the ingredient grams, and don’t let the name contradict the ingredient list.'),
    ...iss.map(([r,x])=>`- ${r.name}: ${x.join('; ')}`),...(t.kcal?['',L2(`Napi keret: ${fmt(t.kcal,0)} kcal, fehérje ${fmt(t.p,0)} g.`,`Daily target: ${fmt(t.kcal,0)} kcal, protein ${fmt(t.p,0)} g.`)]:[]),'',recipeFormat(L2)].join('\n'))}
function recDone(list){if(!list||!list.length){toast(L('Nem találtam olupan-recipes kódblokkot','No olupan-recipes code block found'));return}const[a,u]=importRecipes(list);closeModal();recTab='all';recQ='';recF.clear();recMeal='';if(tab!=='recipes')goFrom('recipes');else render();toast(L(`${a} új, ${u} frissített recept`,`${a} new, ${u} updated recipe${a+u>1?'s':''}`));const iss=recIssues(list.map(x=>(S.recipes||[]).find(y=>deacc(y.name)===deacc(x.name))||x));recFixList=iss;if(iss.length)openModal(`<h2>${L('Receptek ellenőrzése','Recipe check')}</h2>${recIssuesHtml(iss,'recFix()')}<div class="hint">${L('A recepteket elmentettem; javítás után ugyanazzal a névvel frissülnek.','The recipes are saved; after a fix they are updated under the same name.')}</div><div class="row end" style="margin-top:12px"><button class="btn" data-click="closeModal()">${L('Rendben','OK')}</button></div>`)}

let recTab='all',recQ='',recF=new Set(),recMeal='',recStyleAll=false;
function recMatch(r,toks){if(!toks.length)return true;const hay=deacc([r.name,...r.aliases,...r.ing.map(i=>i.n),...r.cuisine.map(c=>lblL(PREF_CUISINE,c)),...recStyles(r).map(s=>lblL(REC_STYLE,s)),...r.tags.map(t=>lblL(REC_TAG,t)),...r.meal.map(m=>lblL(REC_MEAL,m)),...r.season.map(s=>lblL(REC_SEASON,s))].join(' '));return toks.every(t=>hay.includes(t))}
/* Csoporton belül VAGY (egy étel ritkán török és japán is), a csoportok között ÉS; a stílusnál választható ÉS kapcsolat is */
function recFilterOk(r){if(recMeal&&!r.meal.includes(recMeal))return false;const G={t:[],s:[],c:[]};for(const f of recF){const[g,k]=f.split(':');G[g]&&G[g].push(k)}
  const st=k=>k==='seasonal'?r.season.includes(curSeason()):r.style.includes(k);
  if(G.t.length&&!G.t.some(k=>r.tags.includes(k)))return false;
  if(G.c.length&&!G.c.some(k=>r.cuisine.includes(k)))return false;
  if(G.s.length&&!(recStyleAll?G.s.every(st):G.s.some(st)))return false;return true}
function recShown(){const toks=deacc(recQ).split(/\s+/).filter(Boolean);return(S.recipes||[]).filter(r=>(recTab!=='fav'||r.vote===1)&&recFilterOk(r)&&recMatch(r,toks))}
const recFLabel=f=>{const[g,k]=f.split(':');return g==='t'?lblL(REC_TAG,k):g==='s'?(k==='seasonal'?`${lblL(REC_STYLE,k)} (${lblL(REC_SEASON,curSeason()).toLowerCase()})`:lblL(REC_STYLE,k)):lblL(PREF_CUISINE,k)};
function recRow(r){const meta=[r.time?`<span>${I('timer','sm')}${r.time} ${L('perc','min')}</span>`:'',r.kcal!=null?`<span>${I('flame','sm')}${fmt(r.kcal,0)} kcal</span>`:'',r.cuisine.length?`<span>${esc(r.cuisine.map(c=>lblL(PREF_CUISINE,c)).join(', '))}</span>`:'',r.tags[0]?`<span>${esc(lblL(REC_TAG,r.tags[0]))}</span>`:''].filter(Boolean).join('');
  return`<button class="recrow" data-click="openRecipe('${r.id}')"><span style="flex:1;min-width:0"><span class="rn" translate="no">${esc(r.name)}</span><span class="rm">${meta}</span></span>${r.vote===1?`<span class="rv">${I('thumbs-up','sm')}</span>`:r.vote===-1?`<span class="mut">${I('thumbs-down','sm')}</span>`:''}<span class="mut">${I('chevron-right','sm')}</span></button>`}
function recListHtml(){const all=S.recipes||[],l=recShown().sort((a,b)=>(b.vote-a.vote)||a.name.localeCompare(b.name,'hu'));

function eggPacks(n){let best=null;for(let a=0;a<=Math.ceil(n/10)+1;a++)for(let b=0;b<=Math.ceil(n/6)+1;b++){const t=a*10+b*6;if(t<n)continue;const c=[t-n,a+b];if(!best||c[0]<best[0]||c[0]===best[0]&&c[1]<best[1])best=[c[0],c[1],a,b]}
  return best?[best[2]?`${best[2]} × 10-es`:'',best[3]?`${best[3]} × 6-os`:''].filter(Boolean).join(' + ')+L(' csomag',' pack'):''}
function shopHint(g,need){const d=deacc(g.n),u=deacc(g.u||'');
  if(/tojasfeherje|feherje.*tojas|egg white/.test(d)&&(u==='g'||u==='ml')&&need>0)return L(`≈ ${Math.ceil(need/33)} tojás fehérjéje`,`≈ whites of ${Math.ceil(need/33)} eggs`);
  if(/^(friss )?tojas(\s|$)|^eggs?(\s|$)/.test(d)&&(u==='db'||u===''||u==='pcs')&&need>0)return eggPacks(Math.ceil(need));
  return g.pack||''}
function shopGuess(n){const d=deacc(n);return(SHOP_GUESS.find(([,re])=>re.test(d))||['other'])[0]}
// a felhasználó által átsorolt tételek csoportját megjegyezzük, hogy legközelebb is oda kerüljön
function shopCatMem(n){const m=S.settings.shopCat||{};return m[deacc(shopBase(n))]||null}
// összevonáshoz: zárójeles megjegyzés és a vessző utáni elkészítési mód le, mértékegység közösre (g, ml)
/* A zárójeles vagy vessző utáni megjegyzést levágjuk, de a termék formáját (darált, filé, csontos…) megtartjuk, különben pl. „pulykamell, darált” egész pulykamellként kerülne a listára */
const SHOP_FORM=/\b(daralt|ground|minced|file|filet|fillet|egesz|whole|csontos|csont nelkul\w*|kicsontozott|boneless|bone-in|boros|bor nelkul\w*|skinless|fustolt|smoked|fott|cooked|nyers|fagyasztott|frozen|konzerv|tinned|canned|szaritott|dried|reszelt|grated|kockazott|diced|szeletelt|sliced|teljes kiorlesu|wholegrain|light|zsirszegeny|sovany|lean)\b/g;
function shopBase(n){const raw=String(n),extra=[...(raw.match(/\([^)]*\)/g)||[]),...((raw.match(/,\s+\D.*$/)||[])[0]?[raw.match(/,\s+\D.*$/)[0]]:[])].join(' ');
  let b=raw.replace(/\([^)]*\)/g,' ').replace(/,\s+\D.*$/,'').replace(/\s+,/g,',').replace(/\s+/g,' ').trim()||raw.trim();
  if(extra){const have=deacc(b),forms=[],ex=extra.normalize('NFC').toLowerCase(),dx=deacc(ex);let mm;SHOP_FORM.lastIndex=0;while((mm=SHOP_FORM.exec(dx))){const w=ex.slice(mm.index,mm.index+mm[0].length);if(!have.includes(mm[0])&&!forms.some(f=>deacc(f)===mm[0]))forms.push(w)}
    const pre=forms.filter(f=>!f.includes(' ')),post=forms.filter(f=>f.includes(' '));if(pre.length)b=pre.join(' ')+' '+b;if(post.length)b+=', '+post.join(', ')}
  return b}
function shopNorm(q,u){const k=deacc(u||'').trim();if(q==null)return[null,u||''];if(k==='kg')return[q*1000,'g'];if(k==='l')return[q*1000,'ml'];if(k==='dl')return[q*100,'ml'];if(k==='cl')return[q*10,'ml'];return[q,u||'']}
function shopItem(n,q,u,extra){const[nq,nu]=shopNorm(q,u),base=shopBase(n);return Object.assign({id:uid(),n:base.slice(0,80),q:nq!=null?Math.round(nq*100)/100:null,u:String(nu).slice(0,20),cat:shopGuess(String(n).replace(/\(eredeti[^)]*\)/g,'')),pantry:SHOP_PANTRY.test(deacc(base)),done:false},extra||{})}
const fmtShopQ=(q,u)=>{if(!q)return'';if(u==='g'&&q>=1000)return fmtQ(q/1000)+' kg';if(u==='ml'&&q>=1000)return fmtQ(q/1000)+' l';return fmtQ(q)+' '+esc(u)};
function recToShop(){const r=recCur,k=recServ/r.serv;S.shop=(S.shop||[]).filter(x=>x.rid!==r.id);
  for(const i of r.ing)S.shop.push(shopItem(i.n,i.q!=null?i.q*k:null,i.u,Object.assign({rid:r.id,rn:`${r.name} (${recServ} ${L('adag','serv.')})`},i.cat?{cat:i.cat}:{})));
  save();toast(L('Hozzáadva a bevásárlólistához','Added to the shopping list'));render()}
const shopKey=x=>deacc(x.n).replace(/\s+/g,' ').trim()+'|'+deacc(x.u||'');
function shopGroups(){const m=new Map();for(const x of S.shop||[]){const k=shopKey(x);let g=m.get(k);if(!g){g={k,n:x.n,u:x.u,q:0,qn:false,items:[],done:true,cat:shopCatMem(x.n)||shopCatFix(x.n,x.cat||shopGuess(x.n)),pantry:!!x.pantry,pack:x.pack||'',have:0,atHome:false};m.set(k,g)}g.items.push(x);g.have+=x.have||0;if(x.atHome)g.atHome=true;if(x.q!=null)g.q+=x.q;else g.qn=true;if(!x.done)g.done=false;if(!x.pantry)g.pantry=false;if(x.pack&&!g.pack)g.pack=x.pack}
  const ci=c=>{const i=SHOP_CAT_KEYS.indexOf(c);return i<0?99:i};
  return[...m.values()].sort((a,b)=>(a.pantry-b.pantry)||(ci(a.cat)-ci(b.cat))||(a.done-b.done)||a.n.localeCompare(b.n,'hu'))}
function openShop(){renderShop()}
function renderShop(){const sh=S.shop||[],gs=shopGroups(),recs=[...new Map(sh.filter(x=>x.rid).map(x=>[x.rid,x.rn])).entries()];
  openModal(`<h2>${L('Bevásárlólista','Shopping list')}</h2>
  ${gs.length?shopListHtml(gs)

  <div class="row" style="gap:6px;margin-top:12px;flex-wrap:nowrap"><input id="shn" style="flex:1;min-width:0" autocomplete="off" placeholder="${L('Tétel, pl. kenyér','Item, e.g. bread')}"><input id="shq" style="width:86px" autocomplete="off" placeholder="${L('pl. 2 db','e.g. 2 pcs')}"><button class="btn ico p" data-click="shopAdd()" aria-label="${L('Hozzáadás','Add')}">${I('plus','sm')}</button></div>
  ${recs.length?`<div class="grp" style="margin-top:16px">${L('Receptek a listán','Recipes on the list')}</div>${recs.map(([id,n])=>`<div class="row li" style="flex-wrap:nowrap"><span style="flex:1;min-width:0" class="small">${esc(n)}</span><button class="btn sm ico" data-click="shopDelRec('${id}')" aria-label="${L('Recept hozzávalóinak törlése','Remove this recipe’s ingredients')}">${I('x','sm')}</button></div>`).join('')}`:''}
  <div class="row" style="margin-top:14px">${sh.length?`<button class="btn d" data-click="shopClear()">${L('Lista törlése','Clear list')}</button>`:''}${sh.some(x=>x.done)?`<button class="btn" data-click="shopClearDone()">${L('Kipipáltak törlése','Remove ticked')}</button>`:''}<span class="sp"></span><button class="btn" data-click="closeModal()">${L('Bezárás','Close')}</button></div>`)}
function shopListHtml(gs){const row=(g,i)=>{const need=Math.max(0,g.q-g.have),covered=g.have>0&&g.q>0&&need<=0,hint=shopHint(g,need),done=g.done||covered;
  const qty=g.have>0&&g.q?`<s class="mut">${fmtShopQ(g.q,g.u)}</s> ${need>0?fmtShopQ(need,g.u):L('megvan','covered')}`:`${fmtShopQ(g.q,g.u)}${g.qn&&g.q?' +':''}`;
  return`<div class="shopline${done?' done':''}"><button class="shoprow${done?' done':''}" data-click="shopToggle(${i})"><span class="ck">${done?I('check','sm'):''}</span><span style="flex:1;min-width:0"><span translate="no">${esc(g.n)}</span>${hint?` <span class="mut small">· ${esc(hint)}</span>`:g.items.length>1?` <span class="mut small">· ${g.items.length} ${L('receptből','recipes')}</span>`:''}${g.have>0?`<span class="small" style="display:block;color:var(--kj-blue-line)">${L('otthon','at home')}: ${fmtShopQ(g.have,g.u)}</span>`:g.atHome?`<span class="small" style="display:block;color:var(--kj-blue-line)">${I('house','sm')} ${L('otthon van (jelezted) – mennyi?','at home (you said) – how much?')}</span>`:''}</span></button><button class="shqty mono small" data-click="shopHaveBox(${i})" aria-label="${L('Mennyiség, csoport','Amount, section')}">${g.q?qty:I('pencil','sm')}</button></div>`};
  let h='',cur=null,open=false;const ix=gs.map((g,i)=>[g,i]),main=ix.filter(([g])=>!g.pantry),pan=ix.filter(([g])=>g.pantry);
  for(const[g,i]of main){if(g.cat!==cur){if(open)h+='</div>';cur=g.cat;h+=`<div class="shcat">${esc(lblL(SHOP_CATS,cur))}</div><div class="shoplist">`;open=true}h+=row(g,i)}
  if(open)h+='</div>';
  if(pan.length){const left=pan.filter(([g])=>!g.done).length;h+=`<button class="shpanh" data-click="shopPanT()" aria-expanded="${shopPanOpen}"><span class="chev${shopPanOpen?' on':''}">${I('chevron-right','sm')}</span><span style="flex:1;text-align:left">${L('Fűszerek és alapok – ellenőrizd, otthon van-e','Spices and basics – check you have them')}</span><span class="mono small">${left}/${pan.length}</span></button>${shopPanOpen?`<div class="shoplist">${pan.map(([g,i])=>row(g,i)).join('')}</div>`:''}`}
  return h}
let shopPanOpen=false;function shopPanT(){shopPanOpen=!shopPanOpen;renderShop()}
/* A menükérésnél megadott otthoni készlet: ha a Claude nem jelölte, név szerint párosítjuk a lista tételeivel */
function pantryParse(t){return String(t||'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)\s*(\d+(?:[.,]\d+)?)\s*(kg|g|dkg|l|dl|ml|db|darab)?\.?\s*(?:doboz|csomag|zacskó|üveg)?\s*$/i);
  if(!m)return{n:x,q:null,u:''};let q=parseMacro(m[2]),u=(m[3]||'').toLowerCase();if(u==='dkg'){q*=10;u='g'}if(u==='darab')u='db';const[nq,nu]=shopNorm(q,u);return{n:m[1].trim()||x,q:nq,u:nu}}).filter(p=>p.n.length>1)}
function pantryMark(items){const ps=pantryParse(menuOpt().pantry);if(!ps.length)return;
  const seen=new Set();for(const x of items){if(x.atHome||x.have)continue;const xn=deacc(shopBase(x.n));const p=ps.find(p=>{const pn=deacc(p.n);return pn.length>2&&(xn.includes(pn)||pn.includes(xn))});if(!p)continue;
    const k=shopKey(x);x.atHome=true;if(p.q&&!seen.has(k)&&deacc(p.u)===deacc(x.u||'')){x.have=Math.min(p.q,x.q||p.q);if(x.q&&p.q>=x.q)x.done=true;seen.add(k)}}}
/* „Otthon van”: a meglévő mennyiséget levonja a szükségesből; ha fedezi, a tétel kipipáltnak számít */
let haveI=-1;
